server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Grist (http://localhost:8484) fait un fetch() cross-origin vers
    # manifest.json et vers index.html chargé en iframe : sans ce header,
    # le navigateur bloque la réponse (CORS).
    add_header Access-Control-Allow-Origin * always;

    # Le widget statique change fréquemment pendant le dev : désactiver le
    # cache pour toujours voir la dernière version au rechargement dans Grist.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
