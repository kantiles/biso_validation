<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validation BISO</title>
  <link rel="stylesheet" href="style.css" />
  <script src="grist-plugin-api.js"></script>
</head>

<body>
  <div class="stats">
    <div class="stat-box">
      <span class="stat-value stat-value--neutral" id="stat-total">0</span>
      <span class="stat-label">Indicateurs</span>
    </div>
    <div class="stat-box">
      <span class="stat-value stat-value--success" id="stat-validated">0</span>
      <span class="stat-label">Validés</span>
    </div>
    <div class="stat-box">
      <span class="stat-value stat-value--danger" id="stat-to-review">0</span>
      <span class="stat-label">À revoir</span>
    </div>
    <div class="stat-box">
      <span class="stat-value stat-value--neutral" id="stat-todo">0</span>
      <span class="stat-label">À traiter</span>
    </div>
  </div>

  <div class="toolbar">
    <label for="validation-filter">Validation</label>
    <select id="validation-filter">
      <option value="">Tous</option>
      <option value="Oui">Oui</option>
      <option value="Non">Non</option>
      <option value="__empty__">Non renseigné</option>
    </select>

    <label for="indicator-select">Indicateur</label>
    <button id="indicator-prev" type="button" class="nav-button" aria-label="Précédent"><strong>&lt;</strong></button>
    <select id="indicator-select"></select>
    <button id="indicator-next" type="button" class="nav-button" aria-label="Suivant"><strong>&gt;</strong></button>
    <span id="indicator-position" class="indicator-position"></span>
  </div>

  <div id="status" class="status"></div>

  <section class="panel">
    <div id="main-table-container"></div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <label for="annee-select">Année</label>
      <select id="annee-select"></select>
    </div>
    <div id="value-stats" class="value-stats"></div>
    <div id="chart-container" class="chart-container"></div>
  </section>

  <footer class="app-version">v<span id="app-version"></span></footer>

  <script type="module" src="app.js"></script>
</body>

</html>
